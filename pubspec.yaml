version: 1.0.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clipboard: ^0.1.3
  path: ^1.9.1
  url_launcher: ^6.3.1
